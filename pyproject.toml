[project]
name = "signet"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Maguran", email = "maguran.mahendrarajan@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.165.0",
    "gradio>=6.32.0",
    "openai>=3.55.1",
    "polars>=2.1.0",
    "pydantic-settings>=2.16.3",
    "qdrant-client>=1.20.0",
    "sentence-transformers>=6.3.0",
    "streamlit>=1.67.0",
]

[project.scripts]
signet = "signet:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
